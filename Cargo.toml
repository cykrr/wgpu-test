[package]
name = "wgpu_triangle"
version = "0.1.0"
edition = "2021"

[lib]
name = "wgpu_triangle"
crate-type = ["staticlib", "lib"]

[[bin]]
name = "wgpu_triangle"
path = "src/main.rs"

[dependencies]
wgpu = "24"
winit = "0.30"
pollster = "1.0"
env_logger = "0.11"
log = "0.4"
bytemuck = "1.25.2"
glam = { version = "0.34.1", features = ["bytemuck"] }
